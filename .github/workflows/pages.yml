name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base_path is "/vow-new-website" on the github.io address and "" on a custom domain,
      # so the same workflow keeps working after the site moves to its own domain.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site (Eleventy)
        run: npx eleventy
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A separate job on purpose: deploying right after the upload, in the same job, can fail with
  # 'No artifacts named "github-pages"' (actions/deploy-pages issue 451). It also makes this job safe to re-run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
